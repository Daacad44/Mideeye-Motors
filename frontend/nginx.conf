server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  # ── Reverse-proxy the API to the backend service ──
  # Makes the SPA and API SAME-ORIGIN, which removes CORS, mixed-content
  # (HTTPS page → HTTP api) and "wrong host" failures entirely. The browser
  # only ever talks to this web origin; nginx forwards /api to the internal
  # `api` container. Using a variable + Docker's embedded DNS (127.0.0.11)
  # means nginx still starts even if the API is briefly unavailable.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # Long-cache hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
