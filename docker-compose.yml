# ─────────────────────────────────────────────────────────────
# Mideeye Motors — full stack (Coolify-ready)
# Postgres + Redis + API + Web
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mideeye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mideeye}
      POSTGRES_DB: ${POSTGRES_DB:-mideeye}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mideeye}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mideeye}:${POSTGRES_PASSWORD:-mideeye}@db:5432/${POSTGRES_DB:-mideeye}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Same-origin via the nginx /api proxy → reflect origin (also fine cross-origin).
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-mideeye-motors}
    expose:
      - '4000'

  web:
    build:
      context: ./frontend
      args:
        # Same-origin: the browser calls /api and nginx proxies to the api service.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
        VITE_LOGO_PUBLIC_ID: ${VITE_LOGO_PUBLIC_ID:-mideeye-motors/brand/logo}
    restart: unless-stopped
    depends_on:
      - api
    # Coolify's proxy reaches this container on port 80 internally.
    # For local `docker compose up`, uncomment the ports mapping below.
    expose:
      - '80'
    # ports:
    #   - '8080:80'

volumes:
  db_data:
  redis_data:
