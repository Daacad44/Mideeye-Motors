# ─────────────────────────────────────────────────────────────
# Daljir Rental Car — full stack (Coolify-ready)
# Postgres + Redis + API + Web
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daljir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-daljir}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-daljir}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-daljir}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-daljir}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Same-origin via the nginx /api proxy → reflect origin (also fine cross-origin).
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # SMTP / SMS / payments: all optional, see .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Daljir Rental Car <no-reply@daljirrentalcar.com>}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      PAYMENTS_ALLOW_MOCK: ${PAYMENTS_ALLOW_MOCK:-false}
      # WaafiPay merchant credentials (merchant portal). Leave empty to hide WaafiPay.
      WAAFIPAY_MERCHANT_UID: ${WAAFIPAY_MERCHANT_UID:-}
      WAAFIPAY_API_USER_ID: ${WAAFIPAY_API_USER_ID:-}
      WAAFIPAY_API_KEY: ${WAAFIPAY_API_KEY:-}
      WAAFIPAY_API_URL: ${WAAFIPAY_API_URL:-https://api.waafipay.net/asm}
      # First-boot admin accounts. No defaults: set them in Coolify. Existing
      # accounts are never modified by the seed.
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    expose:
      - '4000'

  web:
    build:
      context: ./frontend
      args:
        # Same-origin: the browser calls /api and nginx proxies to the api service.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
        VITE_IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
    restart: unless-stopped
    depends_on:
      - api
    # Coolify's proxy reaches this container on port 80 internally.
    # For local `docker compose up`, uncomment the ports mapping below.
    expose:
      - '80'
    # ports:
    #   - '8080:80'

volumes:
  db_data:
  redis_data:
